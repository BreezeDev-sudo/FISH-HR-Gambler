<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Wheel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1e2028;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 500px;
  }

  /* Roll display */
  .roll-box {
    width: 100%;
    height: 140px;
    background: #2a2d38;
    border: 1.5px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: 2px;
    color: #fff;
    transition: color 0.1s;
  }

  .roll-box .dots span {
    animation: blink 1.2s infinite;
    font-size: 1.5rem;
  }
  .roll-box .dots span:nth-child(2) { animation-delay: 0.2s; }
  .roll-box .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  /* Username row */
  .username-row {
    width: 100%;
    display: flex;
    border: 1.5px solid #fff;
    border-top: none;
  }

  .username-row input {
    flex: 1;
    background: #2a2d38;
    border: none;
    outline: none;
    color: #aaa;
    font-size: 0.9rem;
    padding: 12px 20px;
    font-family: inherit;
    border-bottom: 1px solid #3a3d4a;
  }
  .username-row input::placeholder { color: #555; }

  /* Code input row */
  .input-row {
    width: 100%;
    display: flex;
    border: 1.5px solid #fff;
    border-top: none;
  }

  .input-row input {
    flex: 1;
    background: #2a2d38;
    border: none;
    outline: none;
    color: #aaa;
    font-size: 1rem;
    padding: 18px 20px;
    font-family: inherit;
  }

  .input-row input::placeholder { color: #666; }
  .input-row input.success { color: #4caf50; }
  .input-row input.error { color: #f44336; }

  .confirm-btn {
    width: 60px;
    background: #4caf50;
    border: none;
    cursor: pointer;
    font-size: 1.3rem;
    color: #1a3a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .confirm-btn:hover { background: #45a049; }
  .confirm-btn:disabled { background: #3a7a3a; cursor: not-allowed; }

  /* Bottom row */
  .bottom-row {
    width: 100%;
    display: flex;
    border: 1.5px solid transparent;
  }

  .generate-btn {
    flex: 1;
    background: #3a3d4a;
    border: none;
    color: #fff;
    font-size: 0.95rem;
    padding: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
    display: none;
  }
  .generate-btn.visible { display: block; }
  .generate-btn:hover { background: #444755; }

  .generated-code-box {
    flex: 1;
    background: #2a2d38;
    border: none;
    color: #4caf50;
    font-size: 1rem;
    padding: 14px;
    text-align: center;
    letter-spacing: 2px;
    font-weight: 600;
    display: none;
    cursor: pointer;
    font-family: inherit;
    border-left: 1px solid #3a3d4a;
  }
  .generated-code-box.visible { display: block; }

  /* Admin login */
  .admin-login {
    position: fixed;
    bottom: 20px;
    right: 20px;
  }

  .admin-toggle {
    background: transparent;
    border: 1px solid #3a3d4a;
    color: #555;
    font-size: 0.75rem;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 4px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .admin-toggle:hover { color: #888; border-color: #555; }

  .admin-panel {
    position: fixed;
    bottom: 55px;
    right: 20px;
    background: #2a2d38;
    border: 1px solid #3a3d4a;
    border-radius: 6px;
    padding: 12px;
    display: none;
    flex-direction: column;
    gap: 8px;
    width: 220px;
  }
  .admin-panel.visible { display: flex; }

  .admin-panel input {
    background: #1e2028;
    border: 1px solid #3a3d4a;
    color: #fff;
    padding: 8px 10px;
    font-size: 0.85rem;
    border-radius: 4px;
    outline: none;
    font-family: inherit;
  }

  .admin-panel button {
    background: #4caf50;
    border: none;
    color: #1a3a1a;
    padding: 8px;
    font-size: 0.85rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }

  .admin-panel .error-msg {
    color: #f44336;
    font-size: 0.75rem;
    text-align: center;
  }

  .spinning { animation: flash 0.15s infinite alternate; }
  @keyframes flash {
    from { color: #fff; }
    to { color: #4caf50; }
  }

  .tooltip {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #4caf50;
    color: #1a3a1a;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 0.85rem;
    font-weight: 600;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .tooltip.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">
  <div class="roll-box" id="rollBox">
    <div class="dots">
      <span>●</span><span>●</span><span>●</span>
    </div>
  </div>

  <div class="username-row">
    <input type="text" id="usernameInput" placeholder="Your username" />
  </div>

  <div class="input-row">
    <input type="text" id="codeInput" placeholder="Enter your reward code" maxlength="7" />
    <button class="confirm-btn" id="confirmBtn">✓</button>
  </div>

  <div class="bottom-row">
    <button class="generate-btn" id="generateBtn">Generate Code</button>
    <div class="generated-code-box" id="generatedCode" title="Click to copy"></div>
  </div>
</div>

<div class="admin-login">
  <button class="admin-toggle" id="adminToggle">admin</button>
  <div class="admin-panel" id="adminPanel">
    <input type="password" id="adminPass" placeholder="Password" />
    <button id="adminLoginBtn">Login</button>
    <div class="error-msg" id="adminError"></div>
  </div>
</div>

<div class="tooltip" id="tooltip">Copied!</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA-baj0VL259i8gx0UyyJ4iKMH1A5Yzo0s",
    authDomain: "fish-hr-gambler.firebaseapp.com",
    projectId: "fish-hr-gambler",
    storageBucket: "fish-hr-gambler.firebasestorage.app",
    messagingSenderId: "590910509102",
    appId: "1:590910509102:web:4d2c572ed7d433ba454fbf"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const WEBHOOK = "https://discord.com/api/webhooks/1511113155613556796/vfnXO4ipUx5lprNi_pEJ8dBAVs_hg0Pl0a6mkkE00yhDWXDZrkOYTrXbOrUwMlNcOA_Y";

  async function sendWebhook(message) {
    try {
      await fetch(WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: message })
      });
    } catch (e) {}
  }

  const rewards = {
    "5 EXP": 50,
    "Nothing": 50,
    "10 EXP": 30,
    "Strike Reset": 20,
    "25 EXP": 10,
    "Event Pass": 8,
    "50 EXP": 5,
    "100 EXP": 3,
    "Quota Pass": 1
  };

  function getReward() {
    const pool = [];
    for (const [reward, weight] of Object.entries(rewards)) {
      for (let i = 0; i < weight; i++) pool.push(reward);
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function generateCode() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let p1 = "", p2 = "";
    for (let i = 0; i < 3; i++) p1 += chars[Math.floor(Math.random() * chars.length)];
    for (let i = 0; i < 3; i++) p2 += chars[Math.floor(Math.random() * chars.length)];
    return p1 + "-" + p2;
  }

  const ADMIN_PASSWORD = "Admin127&7";

  let isSpinning = false;
  let isAdmin = false;

  const rollBox = document.getElementById("rollBox");
  const usernameInput = document.getElementById("usernameInput");
  const codeInput = document.getElementById("codeInput");
  const confirmBtn = document.getElementById("confirmBtn");
  const generateBtn = document.getElementById("generateBtn");
  const generatedCode = document.getElementById("generatedCode");
  const adminToggle = document.getElementById("adminToggle");
  const adminPanel = document.getElementById("adminPanel");
  const adminPass = document.getElementById("adminPass");
  const adminLoginBtn = document.getElementById("adminLoginBtn");
  const adminError = document.getElementById("adminError");
  const tooltip = document.getElementById("tooltip");

  function spinWheel() {
    return new Promise(resolve => {
      let last;
      let count = 0;
      const total = 12;
      rollBox.classList.add("spinning");

      function step() {
        last = getReward();
        rollBox.textContent = last;
        count++;
        if (count < total) {
          setTimeout(step, count * 40);
        } else {
          rollBox.classList.remove("spinning");
          resolve(last);
        }
      }
      step();
    });
  }

  confirmBtn.addEventListener("click", async () => {
    if (isSpinning) return;
    const code = codeInput.value.trim().toUpperCase();
    const username = usernameInput.value.trim() || "Unknown";
    if (!code) return;

    confirmBtn.disabled = true;

    const ref = doc(db, "codes", code);
    const snap = await getDoc(ref);

    if (!snap.exists() || snap.data().used === true) {
      codeInput.value = "Invalid Code";
      codeInput.classList.add("error");
      setTimeout(() => {
        codeInput.value = "";
        codeInput.classList.remove("error");
        confirmBtn.disabled = false;
      }, 3000);
      return;
    }

    await updateDoc(ref, { used: true });
    await sendWebhook(`Code Used: **${code}**\n- - -`);

    codeInput.value = "Success!";
    codeInput.classList.add("success");

    isSpinning = true;
    rollBox.innerHTML = "";
    const result = await spinWheel();
    isSpinning = false;

    await sendWebhook(`**${username}** got **${result}**\n- - -`);

    setTimeout(() => {
      codeInput.value = "";
      codeInput.classList.remove("success");
      confirmBtn.disabled = false;
    }, 3000);
  });

  generateBtn.addEventListener("click", async () => {
    const code = generateCode();
    const ref = doc(db, "codes", code);
    await setDoc(ref, { used: false, createdAt: Date.now() });
    generatedCode.textContent = code;
    generatedCode.classList.add("visible");
    await sendWebhook(`Code Created: **${code}**\n- - -`);
  });

  generatedCode.addEventListener("click", () => {
    navigator.clipboard.writeText(generatedCode.textContent);
    tooltip.classList.add("show");
    setTimeout(() => tooltip.classList.remove("show"), 1500);
  });

  adminToggle.addEventListener("click", () => {
    adminPanel.classList.toggle("visible");
  });

  adminLoginBtn.addEventListener("click", () => {
    if (adminPass.value === ADMIN_PASSWORD) {
      isAdmin = true;
      adminPanel.classList.remove("visible");
      generateBtn.classList.add("visible");
      adminError.textContent = "";
      adminPass.value = "";
    } else {
      adminError.textContent = "Wrong password";
    }
  });

  adminPass.addEventListener("keydown", e => {
    if (e.key === "Enter") adminLoginBtn.click();
  });
</script>
</body>
</html>
